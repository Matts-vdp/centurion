<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Manager</title>
<style>
  :root {
    --bg: #f7f7f8; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b73; --border: #e3e3e8;
    --accent: #3b5bdb; --tool: #f1f3f5; --user: #e7edff; --err: #c92a2a; --ok: #2b8a3e; --warn: #e67700;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151518; --panel: #1d1d21; --text: #e8e8ea; --muted: #9a9aa3; --border: #2e2e35;
      --accent: #748ffc; --tool: #25252b; --user: #263052; --err: #ff6b6b; --ok: #69db7c; --warn: #ffa94d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; }
  aside { width: 300px; flex: none; border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; }
  aside h1 { font-size: 15px; margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  #tree { flex: 1; overflow: auto; padding: 6px 0; }
  .node { padding: 6px 14px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
  .node:hover { background: var(--tool); }
  .node.sel { background: var(--user); }
  .node.child { padding-left: 34px; }
  .node .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node .meta { color: var(--muted); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.running { background: var(--accent); animation: pulse 1s infinite alternate; }
  .dot.idle { background: var(--ok); } .dot.error { background: var(--err); } .dot.interrupted { background: var(--warn); }
  @keyframes pulse { to { opacity: .35; } }
  form.new { border-top: 1px solid var(--border); padding: 10px 14px; display: grid; gap: 6px; }
  input, textarea, button { font: inherit; color: inherit; }
  input, textarea { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); }
  button { padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel); display: flex; gap: 12px; align-items: center; }
  header .title { font-weight: 600; } header .sub { color: var(--muted); font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #log { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { white-space: pre-wrap; word-wrap: break-word; max-width: 900px; }
  .msg.user { background: var(--user); padding: 8px 12px; border-radius: 8px; align-self: flex-start; }
  .msg.user .src { font-size: 11px; color: var(--muted); display: block; }
  details.tool { background: var(--tool); border-radius: 6px; max-width: 900px; font-size: 13px; }
  details.tool summary { padding: 4px 10px; cursor: pointer; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  details.tool summary b { color: var(--text); font-weight: 600; }
  details.tool.err summary { color: var(--err); }
  details.tool pre { margin: 0; padding: 6px 10px; white-space: pre-wrap; word-break: break-word; max-height: 400px; overflow: auto; border-top: 1px solid var(--border); font-size: 12px; }
  .note { color: var(--muted); font-size: 12px; } .note.err { color: var(--err); }
  .composer { border-top: 1px solid var(--border); padding: 10px 16px; display: flex; gap: 8px; background: var(--panel); }
  .composer textarea { resize: vertical; min-height: 44px; }
  .empty { margin: auto; color: var(--muted); }
  @media (max-width: 700px) { body { flex-direction: column; } aside { width: auto; max-height: 40vh; } }
</style>
</head>
<body>
<aside>
  <h1>Agents</h1>
  <div id="tree"></div>
  <form class="new" id="newForm">
    <input id="newName" placeholder="Orchestrator name" required>
    <input id="newCwd" placeholder="Absolute folder path" required>
    <button class="primary">Start orchestrator</button>
  </form>
</aside>
<main>
  <header id="head"><span class="empty">Select an agent</span></header>
  <div id="log"></div>
  <form class="composer" id="composer" hidden>
    <textarea id="text" placeholder="Message this agent (Ctrl+Enter to send)"></textarea>
    <button class="primary">Send</button>
  </form>
</main>
<script>
const params = new URLSearchParams(location.search);
let token = params.get('token') || '';
try { if (token) sessionStorage.setItem('token', token); else token = sessionStorage.getItem('token') || ''; } catch {}

const agents = new Map();
let selected = null;
let seen = new Set();          // uuids rendered in the transcript
let toolEls = new Map();       // tool_use_id -> <details>

const api = async (path, opts = {}) => {
  const res = await fetch(path, { ...opts, headers: { 'content-type': 'application/json', authorization: `Bearer ${token}` } });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
};
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

// ---------- tree ----------
function renderTree() {
  const tree = document.getElementById('tree');
  tree.replaceChildren();
  const list = [...agents.values()];
  for (const o of list.filter(a => !a.parentId)) {
    tree.append(nodeEl(o, false));
    for (const c of list.filter(a => a.parentId === o.id)) tree.append(nodeEl(c, true));
  }
  if (!list.length) tree.append(el('div', 'note', '  No agents yet.'));
}
function nodeEl(a, child) {
  const n = el('div', 'node' + (child ? ' child' : '') + (a.id === selected ? ' sel' : ''));
  n.append(el('span', 'dot ' + a.status), el('span', 'name', a.name));
  const meta = [a.status, a.queue.length ? `${a.queue.length} queued` : ''].filter(Boolean).join(' · ');
  n.append(el('span', 'meta', meta));
  n.title = a.cwd;
  n.onclick = () => select(a.id);
  return n;
}

// ---------- header ----------
function renderHead() {
  const head = document.getElementById('head');
  const a = agents.get(selected);
  if (!a) return;
  head.replaceChildren();
  head.append(el('span', 'dot ' + a.status), el('span', 'title', a.name),
    el('span', 'sub', `${a.kind} · ${a.cwd} · ${a.status}${a.queue.length ? ` · ${a.queue.length} queued` : ''} · $${(a.costUsd || 0).toFixed(3)}`));
  const stop = el('button', '', 'Stop');
  stop.disabled = a.status !== 'running' && !a.queue.length;
  stop.onclick = () => api(`/api/agents/${a.id}/stop`, { method: 'POST' }).catch(alert);
  head.append(stop);
}

// ---------- transcript ----------
const log = () => document.getElementById('log');
const atBottom = () => { const l = log(); return l.scrollHeight - l.scrollTop - l.clientHeight < 60; };
function append(node) { const stick = atBottom(); log().append(node); if (stick) log().scrollTop = log().scrollHeight; }

function summarizeInput(name, input) {
  if (!input) return '';
  const v = input.command || input.file_path || input.path || input.pattern || input.url || input.query || input.description || input.message || input.name;
  return typeof v === 'string' ? v.split('\n')[0].slice(0, 140) : JSON.stringify(input).slice(0, 140);
}
function toolResultText(content) {
  if (typeof content === 'string') return content;
  if (Array.isArray(content)) return content.map(c => c.type === 'text' ? c.text : `[${c.type}]`).join('\n');
  return JSON.stringify(content, null, 2);
}

function renderUserPrompt(text, source) {
  const m = el('div', 'msg user');
  if (source && source !== 'user') m.append(el('span', 'src', source === 'manager' ? 'manager notification' : `from ${source}`));
  m.append(document.createTextNode(text));
  append(m);
}

/** Render an assistant or user message body (shared by history and live events). */
function renderMessage(type, message, uuid, fromHistory) {
  if (uuid) { if (seen.has(uuid)) return; seen.add(uuid); }
  const content = message?.content;
  if (type === 'user') {
    if (typeof content === 'string') { if (fromHistory) renderUserPrompt(content); return; }
    for (const block of content || []) {
      if (block.type === 'tool_result') {
        const d = toolEls.get(block.tool_use_id);
        const pre = el('pre', '', toolResultText(block.content));
        if (d) { if (block.is_error) d.classList.add('err'); d.append(pre); }
      } else if (block.type === 'text' && fromHistory) renderUserPrompt(block.text);
    }
    return;
  }
  for (const block of content || []) {
    if (block.type === 'text' && block.text.trim()) append(el('div', 'msg', block.text));
    else if (block.type === 'tool_use') {
      const d = el('details', 'tool');
      const s = el('summary');
      s.append(el('b', '', block.name.replace(/^mcp__manager__/, '')), document.createTextNode('  ' + summarizeInput(block.name, block.input)));
      d.append(s, el('pre', '', JSON.stringify(block.input, null, 2)));
      toolEls.set(block.id, d);
      append(d);
    }
  }
}

function renderLive(msg) {
  if (msg.parent_tool_use_id) return; // subagent internals stay hidden in the POC
  if (msg.type === 'assistant' || msg.type === 'user') return renderMessage(msg.type, msg.message, msg.uuid, false);
  if (msg.type === 'result') {
    const secs = (msg.duration_ms / 1000).toFixed(0);
    append(el('div', 'note' + (msg.is_error ? ' err' : ''), msg.is_error ? `Turn failed (${msg.subtype}) after ${secs}s` : `Turn finished in ${secs}s`));
  } else if (msg.type === 'system' && msg.subtype === 'permission_denied') {
    append(el('div', 'note err', `Denied: ${msg.tool_name}${msg.decision_reason ? ' — ' + msg.decision_reason : ''}`));
  } else if (msg.type === 'system' && msg.subtype === 'api_retry') {
    append(el('div', 'note', 'API retry…'));
  }
}

async function select(id) {
  selected = id; seen = new Set(); toolEls = new Map();
  log().replaceChildren();
  document.getElementById('composer').hidden = false;
  renderTree(); renderHead();
  try {
    const history = await api(`/api/agents/${id}/history`);
    if (selected !== id) return;
    for (const m of history) if (!m.parent_tool_use_id) renderMessage(m.type, m.message, m.uuid, true);
    const a = agents.get(id);
    if (a?.current) renderUserPrompt(a.current.text, a.current.source);
    log().scrollTop = log().scrollHeight;
  } catch (e) { append(el('div', 'note err', 'Could not load history: ' + e.message)); }
}

// ---------- events ----------
function connect() {
  const es = new EventSource(`/api/events?token=${encodeURIComponent(token)}`);
  es.addEventListener('snapshot', e => { agents.clear(); for (const a of JSON.parse(e.data)) agents.set(a.id, a); renderTree(); renderHead(); });
  es.addEventListener('agent', e => { const a = JSON.parse(e.data); agents.set(a.id, a); renderTree(); if (a.id === selected) renderHead(); });
  es.addEventListener('delivered', e => { const d = JSON.parse(e.data); if (d.agentId === selected) renderUserPrompt(d.message.text, d.message.source); });
  es.addEventListener('message', e => { const d = JSON.parse(e.data); if (d.agentId === selected) renderLive(d.message); });
  es.onerror = () => { if (es.readyState === EventSource.CLOSED) setTimeout(connect, 2000); };
}

// ---------- forms ----------
document.getElementById('newForm').onsubmit = async (e) => {
  e.preventDefault();
  try {
    const a = await api('/api/agents', { method: 'POST', body: JSON.stringify({ name: newName.value, cwd: newCwd.value }) });
    agents.set(a.id, a); newName.value = ''; select(a.id);
  } catch (err) { alert(err.message); }
};
const composer = document.getElementById('composer');
composer.onsubmit = async (e) => {
  e.preventDefault();
  const t = document.getElementById('text');
  if (!t.value.trim() || !selected) return;
  try { await api(`/api/agents/${selected}/messages`, { method: 'POST', body: JSON.stringify({ text: t.value }) }); t.value = ''; }
  catch (err) { alert(err.message); }
};
document.getElementById('text').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) composer.requestSubmit(); });

api('/api/info').then(i => { if (!newCwd.value) newCwd.value = i.cwd; }).catch(() => {});
connect();
renderTree();
</script>
</body>
</html>
